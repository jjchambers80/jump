# Claude Code automated PR review.
#
# Cost gates (agents open many PRs — review only what matters):
#   1. Runs on ready_for_review, or when the `claude-review` label is added.
#      Draft PRs and plain pushes (`synchronize`) never trigger a review;
#      re-review by removing/re-adding the label or commenting `@claude`.
#   2. paths-ignore skips PRs that only touch docs, specs, lockfiles.
#   3. Size cap: PRs over MAX_CHANGED_LINES get a "split this" comment instead
#      of a review, unless labeled `deep-review`.
#   4. Haiku 4.5 by default; `deep-review` label escalates to Sonnet 5.
#   5. One run per PR at a time — a newer trigger cancels the older one.
#
# Secrets required:
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token` on a Pro/Max plan
#                              (usage counts against the subscription). OR:
#   ANTHROPIC_API_KEY        — pay-per-token; swap the auth input on both jobs.

name: Claude Review

on:
  pull_request:
    types: [ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - "package-lock.json"
      - "**/package-lock.json"
      - ".github/agents/**"
      - ".github/prompts/**"
  issue_comment:
    types: [created]

env:
  MAX_CHANGED_LINES: 800
  DEFAULT_MODEL: claude-haiku-4-5-20251001
  DEEP_MODEL: claude-sonnet-5

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Automatic review: PR marked ready, or `claude-review` / `deep-review` label.
  # ---------------------------------------------------------------------------
  auto-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'labeled' &&
          (github.event.label.name == 'claude-review' || github.event.label.name == 'deep-review'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Size gate + model selection
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DEEP: ${{ contains(github.event.pull_request.labels.*.name, 'deep-review') }}
        run: |
          set -euo pipefail
          read -r ADD DEL < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json additions,deletions --jq '"\(.additions) \(.deletions)"')
          TOTAL=$((ADD + DEL))
          echo "changed=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$DEEP" = "true" ]; then
            echo "model=$DEEP_MODEL" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "model=$DEFAULT_MODEL" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL" -gt "$MAX_CHANGED_LINES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
              "⏭️ Claude review skipped: ${TOTAL} changed lines exceeds the ${MAX_CHANGED_LINES}-line cap. Split the PR, or add the \`deep-review\` label to force a full review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          fetch-depth: 1

      - name: Review
        if: steps.gate.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          track_progress: false
          claude_args: |
            --model ${{ steps.gate.outputs.model }}
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in the Jump ticketing platform. Read
            CLAUDE.md, AGENTS.md, and the relevant subdirectory AGENTS.md /
            CLAUDE.md files first — they are the project's rules. Then fetch the
            diff with `gh pr diff`.

            Report only real problems. No praise, no restating the diff, no style
            nits unless they change behavior. Skip anything a linter would catch.

            Priorities, in order:
            1. Correctness bugs and logic errors in the changed code.
            2. Security: auth/tenant scoping (every query must be scoped to the
               active organization), input validation, secrets, SSRF/XSS.
            3. Project invariants from CLAUDE.md / AGENTS.md, including:
               - Prisma only via `import { prisma } from "@jump/db"` — never a
                 direct `new PrismaClient()`.
               - Payment state changes only via the Stripe webhook handler
                 (`POST /webhooks/stripe`); never trust client-side status.
               - Capacity enforcement must keep the `SELECT ... FOR UPDATE`
                 lock on PriceTier.
               - Any component using `useSearchParams()` is wrapped in
                 `<Suspense>`.
               - Schema changes ship with a migration and `db:generate`.
            4. Missing or wrong tests for changed behavior.
            5. Performance: N+1 queries, unbounded queries, missing indexes.

            Output:
            - For each concrete issue tied to specific lines, post an inline
              comment with `mcp__github_inline_comment__create_inline_comment`
              (use `confirmed: true`). Format the body as
              `**[severity]** problem. Fix: suggestion.` where severity is one of
              BLOCKER, HIGH, MEDIUM, LOW.
            - Then post one summary comment via `gh pr comment` with: a verdict
              line (`✅ Ready to merge` / `⚠️ Merge with fixes` / `🛑 Blocked`),
              a bullet list of the inline findings by severity, and any
              cross-cutting concerns that don't map to a single line.
            - If there are no findings, post only the summary with the ✅ verdict
              and one sentence on what you checked.

  # ---------------------------------------------------------------------------
  # On-demand: comment `@claude ...` on any PR to ask for a review or a
  # specific question. Uses the action's default tag mode so the comment text
  # becomes the instruction.
  # ---------------------------------------------------------------------------
  on-demand:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'deep-review') && 'claude-sonnet-5' || 'claude-haiku-4-5-20251001' }}
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
