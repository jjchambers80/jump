openapi: 3.0.3
info:
  title: Jump Ticketing API
  description: |
    REST API for the Jump ticketing platform.
    Schema redesign: normalized Organization -> Venue -> Event -> PriceTier -> Order -> Ticket hierarchy.
  version: 2.0.0
  contact:
    name: Jump Platform
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.jump.example.com
    description: Production

tags:
  - name: Events
    description: Public event listing
  - name: Orders
    description: Ticket purchase and order management
  - name: Tickets
    description: Ticket retrieval and redemption
  - name: Organizations
    description: Organization management
  - name: Org Events
    description: Organization-scoped event management
  - name: Org Venues
    description: Organization-scoped venue management
  - name: Org Orders
    description: Organization-scoped order management
  - name: Users
    description: User administration
  - name: Auth
    description: Authentication (Auth.js v5)
  - name: Webhooks
    description: External service callbacks

paths:
  # ===== PUBLIC EVENTS =====
  /events:
    get:
      tags: [Events]
      summary: List published events
      description: Returns paginated list of published events with price tiers and available capacity
      operationId: listEvents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Event list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get event details with price tiers
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== ORDERS =====
  /orders:
    post:
      tags: [Orders]
      summary: Create order (guest checkout)
      description: |
        Initiates a ticket purchase. Creates a Contact (or finds existing by email),
        creates an Order with PENDING status, reserves PriceTier inventory, and
        creates a Stripe Checkout session. Public endpoint — no auth required.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, items, email, firstName, lastName]
              properties:
                eventId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [priceTierId, quantity]
                    properties:
                      priceTierId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 10
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        "201":
          description: Order created, Stripe Checkout session returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  checkoutUrl:
                    type: string
                    format: uri
                  sessionId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Insufficient capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /orders/my:
    get:
      tags: [Orders]
      summary: Get authenticated user's orders
      description: Returns all orders placed by the currently authenticated user (matched via Contact.userId)
      operationId: getMyOrders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order detail
      description: Returns order with tickets. Requires authentication; user must own the order.
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/lookup:
    post:
      tags: [Orders]
      summary: Guest order lookup
      description: Look up an order by email and order reference (for guests without accounts)
      operationId: lookupOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, orderRef]
              properties:
                email:
                  type: string
                  format: email
                orderRef:
                  type: string
                  description: Human-readable order reference (e.g., "JMP-A1B2C3")
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== TICKETS =====
  /tickets/purchase:
    post:
      tags: [Tickets]
      summary: Purchase tickets (legacy)
      description: Initiates Stripe Checkout session for ticket purchase. Prefer POST /orders for new integrations.
      operationId: purchaseTickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, quantity, customerEmail, customerName]
              properties:
                eventId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                customerEmail:
                  type: string
                  format: email
                customerName:
                  type: string
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl:
                    type: string
                    format: uri
                  sessionId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Insufficient capacity

  /tickets/confirm:
    get:
      tags: [Tickets]
      summary: Confirm purchase and retrieve tickets
      description: Called after Stripe Checkout success redirect
      operationId: confirmPurchase
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tickets retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketDetail"
        "202":
          description: Payment still processing

  /tickets/my:
    get:
      tags: [Tickets]
      summary: Get authenticated user's tickets
      operationId: getMyTickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ticket list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tickets/redeem:
    post:
      tags: [Tickets]
      summary: Redeem ticket via QR code
      description: Validates and redeems a ticket using the signed JWT from the QR code barcode
      operationId: redeemTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken:
                  type: string
                  description: Signed JWT from the ticket QR code
      responses:
        "200":
          description: Ticket redeemed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          description: Invalid or expired QR token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ticket already redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===== ORGANIZATIONS =====
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      operationId: listOrganizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Organizations]
      summary: Create organization
      description: Admin-only endpoint for creating a new organization
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===== ORG-SCOPED VENUES =====
  /organizations/{orgId}/venues:
    get:
      tags: [Org Venues]
      summary: List venues for organization
      operationId: listOrgVenues
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Venue list
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/Venue"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Org Venues]
      summary: Create venue
      operationId: createVenue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name:
                  type: string
                address:
                  type: string
                timezone:
                  type: string
                  default: "America/New_York"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===== ORG-SCOPED EVENTS =====
  /organizations/{orgId}/events:
    get:
      tags: [Org Events]
      summary: List events for organization
      description: Returns all events (any status) for the organization, accessible to org members
      operationId: listOrgEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, CANCELLED]
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Org Events]
      summary: Create event with price tiers
      description: Creates a new event under a venue belonging to this organization, including price tiers
      operationId: createOrgEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgId}/events/{eventId}:
    patch:
      tags: [Org Events]
      summary: Update event
      operationId: updateOrgEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgId}/events/{eventId}/publish:
    post:
      tags: [Org Events]
      summary: Publish event
      description: Transitions event from DRAFT to PUBLISHED, making it visible to customers
      operationId: publishOrgEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          description: Event not in DRAFT status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgId}/events/{eventId}/cancel:
    post:
      tags: [Org Events]
      summary: Cancel event
      description: Transitions event to CANCELLED status. Voids all valid tickets.
      operationId: cancelOrgEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgId}/events/{eventId}/analytics:
    get:
      tags: [Org Events]
      summary: Get per-tier analytics for event
      description: Returns sales analytics broken down by price tier
      operationId: getEventAnalytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Analytics retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAnalytics"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== ORG-SCOPED ORDERS =====
  /organizations/{orgId}/events/{eventId}/orders:
    get:
      tags: [Org Orders]
      summary: List orders for event (org-scoped)
      description: Returns all orders for a specific event, accessible to org admins/organizers
      operationId: listEventOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/EventId"
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, COMPLETED, FAILED]
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===== USERS (ADMIN) =====
  /users:
    get:
      tags: [Users]
      summary: List users (admin)
      description: Admin-only endpoint to list all users with filtering
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [CUSTOMER, ORGANIZER, ADMIN]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{userId}:
    patch:
      tags: [Users]
      summary: Update user (admin)
      description: Admin-only endpoint to update user role, organization, or active status
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [CUSTOMER, ORGANIZER, ADMIN]
                organizationId:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== AUTH =====
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user session
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===== ADMIN (LEGACY) =====
  /admin/events:
    post:
      tags: [Admin]
      summary: Create event (legacy)
      description: Legacy admin endpoint. Prefer POST /organizations/{orgId}/events for new integrations.
      operationId: createEvent
      deprecated: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/dashboard/stats:
    get:
      tags: [Admin]
      summary: Get admin dashboard statistics
      description: Legacy stats endpoint. Prefer /organizations/{orgId}/events/{eventId}/analytics.
      operationId: getDashboardStats
      deprecated: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===== WEBHOOKS =====
  /webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Stripe payment webhook
      description: |
        Receives Stripe payment events (checkout.session.completed, payment_intent.succeeded, etc.).
        Updates Order status, confirms PriceTier inventory, generates QR codes, and emails tickets.
      operationId: stripeWebhook
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid signature

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth.js v5 JWT token

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
      description: Organization ID (cuid)

    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
      description: Event ID (cuid)

  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Venue:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        address:
          type: string
        timezone:
          type: string
        isPublic:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EventSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        category:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CANCELLED]
        venue:
          $ref: "#/components/schemas/Venue"
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
        remainingCapacity:
          type: integer

    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          properties:
            capacity:
              type: integer
            ticketsSold:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    EventCreate:
      type: object
      required: [venueId, name, date, capacity, priceTiers]
      properties:
        venueId:
          type: string
        name:
          type: string
          maxLength: 255
        description:
          type: string
        date:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
        category:
          type: string
        priceTiers:
          type: array
          items:
            type: object
            required: [name, price, quantityTotal]
            properties:
              name:
                type: string
              price:
                type: number
                format: decimal
                minimum: 0
              quantityTotal:
                type: integer
                minimum: 1

    EventUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        capacity:
          type: integer
        category:
          type: string

    PriceTier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
          format: decimal
        quantityTotal:
          type: integer
        quantitySold:
          type: integer
        quantityAvailable:
          type: integer
        isActive:
          type: boolean

    Order:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        orderRef:
          type: string
        totalAmount:
          type: number
          format: decimal
        currency:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        createdAt:
          type: string
          format: date-time

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            event:
              $ref: "#/components/schemas/EventSummary"
            contact:
              type: object
              properties:
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
            tickets:
              type: array
              items:
                $ref: "#/components/schemas/TicketDetail"

    TicketDetail:
      type: object
      properties:
        id:
          type: string
        event:
          $ref: "#/components/schemas/EventSummary"
        priceTier:
          type: object
          properties:
            name:
              type: string
        pricePaid:
          type: number
          format: decimal
        barcode:
          type: string
        qrCode:
          type: string
          description: Base64-encoded QR code image or data URL
        status:
          type: string
          enum: [VALID, REDEEMED, EXPIRED, VOIDED]
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [CUSTOMER, ORGANIZER, ADMIN]
        organizationId:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EventAnalytics:
      type: object
      properties:
        eventId:
          type: string
        eventName:
          type: string
        totalCapacity:
          type: integer
        totalSold:
          type: integer
        totalRevenue:
          type: number
          format: decimal
        tiers:
          type: array
          items:
            type: object
            properties:
              tierId:
                type: string
              tierName:
                type: string
              price:
                type: number
                format: decimal
              quantityTotal:
                type: integer
              quantitySold:
                type: integer
              revenue:
                type: number
                format: decimal

    DashboardStats:
      type: object
      properties:
        totalCapacity:
          type: integer
        ticketsSold:
          type: integer
        remainingCapacity:
          type: integer
        ticketsRedeemed:
          type: integer

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Validation failed"
            message: "Invalid email format"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Unauthorized"
            message: "Please login to access this resource"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Forbidden"
            message: "Admin or organizer role required"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Not found"
            message: "Resource does not exist"
