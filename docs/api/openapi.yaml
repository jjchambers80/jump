openapi: 3.0.3
info:
  title: Jump Ticketing API
  description: REST API for online ticket purchase and event management
  version: 1.0.0
  contact:
    name: Jump Platform
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.jump.example.com/v1
    description: Production

tags:
  - name: Events
    description: Event listing and management
  - name: Tickets
    description: Ticket purchase and retrieval
  - name: Auth
    description: Authentication and session management
  - name: Admin
    description: Administrative operations (RBAC protected)
  - name: Webhooks
    description: External service callbacks

paths:
  # ===== EVENTS =====
  /events:
    get:
      tags: [Events]
      summary: List published events
      description: Returns paginated list of published events with available capacity
      operationId: listEvents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Event list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get event details
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===== TICKETS =====
  /tickets/purchase:
    post:
      tags: [Tickets]
      summary: Purchase tickets
      description: Initiates Stripe Checkout session for ticket purchase
      operationId: purchaseTickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, quantity, customerEmail, customerName]
              properties:
                eventId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                customerEmail:
                  type: string
                  format: email
                customerName:
                  type: string
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl:
                    type: string
                    format: uri
                  sessionId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Insufficient capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Only 3 tickets available"

  /tickets/confirm:
    get:
      tags: [Tickets]
      summary: Confirm purchase and retrieve tickets
      description: Called after Stripe Checkout success redirect
      operationId: confirmPurchase
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tickets retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketDetail"
        "202":
          description: Payment processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "processing"
                  message:
                    type: string
                    example: "Payment confirmation pending"

  /tickets/my:
    get:
      tags: [Tickets]
      summary: Get customer purchase history
      description: Returns all tickets purchased by authenticated customer
      operationId: getMyTickets
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Ticket history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===== AUTH =====
  /auth/register:
    post:
      tags: [Auth]
      summary: Register customer account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login customer or admin
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sessionId=abc123; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/Customer"
                      - $ref: "#/components/schemas/Admin"
                  userType:
                    type: string
                    enum: [customer, admin]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate session
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Logout successful

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user session
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/Customer"
                      - $ref: "#/components/schemas/Admin"
                  userType:
                    type: string
                    enum: [customer, admin]
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===== ADMIN =====
  /admin/events:
    post:
      tags: [Admin]
      summary: Create event
      description: Admin-only endpoint for event creation
      operationId: createEvent
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/events/{eventId}:
    patch:
      tags: [Admin]
      summary: Update event
      description: Admin-only endpoint for event modification
      operationId: updateEvent
      security:
        - cookieAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/events/{eventId}/publish:
    post:
      tags: [Admin]
      summary: Publish event
      description: Makes event visible to customers
      operationId: publishEvent
      security:
        - cookieAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/dashboard/stats:
    get:
      tags: [Admin]
      summary: Get admin dashboard statistics
      description: Real-time sales and redemption counts
      operationId: getDashboardStats
      security:
        - cookieAuth: []
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stats retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===== WEBHOOKS =====
  /webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Stripe payment webhook
      description: Receives Stripe payment confirmation events
      operationId: stripeWebhook
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe event payload (varies by event type)
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid signature

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionId

  schemas:
    EventSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        date:
          type: string
          format: date-time
        venue:
          type: string
        ticketPrice:
          type: number
          format: decimal
        remainingCapacity:
          type: integer

    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          properties:
            capacity:
              type: integer
            ticketsSold:
              type: integer
            status:
              type: string
              enum: [draft, published]
            organizer:
              type: object
              properties:
                name:
                  type: string
                organization:
                  type: string

    EventCreate:
      type: object
      required: [name, date, venue, capacity, ticketPrice]
      properties:
        name:
          type: string
          maxLength: 255
        date:
          type: string
          format: date-time
        venue:
          type: string
          maxLength: 500
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
        ticketPrice:
          type: number
          format: decimal
          minimum: 0

    EventUpdate:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
          format: date-time
        venue:
          type: string
        ticketPrice:
          type: number
          format: decimal

    TicketDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event:
          $ref: "#/components/schemas/EventSummary"
        purchaseTime:
          type: string
          format: date-time
        pricePaid:
          type: number
          format: decimal
        qrCode:
          type: string
          description: Base64-encoded PNG or data URL
        status:
          type: string
          enum: [valid, redeemed, expired]

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    Admin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        organization:
          type: string

    DashboardStats:
      type: object
      properties:
        totalCapacity:
          type: integer
        ticketsSold:
          type: integer
        remainingCapacity:
          type: integer
        ticketsRedeemed:
          type: integer
        salesRate:
          type: number
          description: Tickets sold per minute (last hour)
        paymentSuccessRate:
          type: number
          description: Percentage (0-100)

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Validation failed"
            message: "Invalid email format"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Unauthorized"
            message: "Please login to access this resource"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Forbidden"
            message: "Admin role required"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Not found"
            message: "Event does not exist"
