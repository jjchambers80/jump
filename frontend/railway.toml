[build]
builder = "nixpacks"
buildCommand = "cd .. && npm install && cd frontend && npx prisma generate --schema=../packages/db/prisma/schema.prisma && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
rootDirectory = "/"
